# CI only: disposable project and loopback ephemeral ports, no host/source mounts.
services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: attendance_test
      POSTGRES_USER: test_owner
      POSTGRES_PASSWORD: ci-disposable-not-a-production-secret
    ports: ['127.0.0.1::5432']
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test_owner -d attendance_test]
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ci-storage-user
      MINIO_ROOT_PASSWORD: ci-disposable-storage-secret
    ports: ['127.0.0.1::9000']

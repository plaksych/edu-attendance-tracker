name: Production promotion review (no remote deployment)
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run for the exact reviewed revision
        required: true
      revision:
        description: Full commit SHA, not a branch or tag
        required: true
      evidence_url:
        description: Private release record with image digests, restore drill and schema review
        required: true
permissions:
  contents: read
jobs:
  approve:
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a successful trusted CI run for the supplied SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
          REVISION: ${{ inputs.revision }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['RUN_ID']
          revision = os.environ['REVISION']
          assert re.fullmatch(r'[0-9]+', run_id)
          assert re.fullmatch(r'[a-f0-9]{40}', revision)
          record = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"]))
          assert record['head_sha'] == revision and record['conclusion'] == 'success'
          assert record['event'] == 'push' and record['head_branch'] in ('main', 'production')
          assert record['path'] == '.github/workflows/ci.yml'
          assert os.environ['EVIDENCE_URL'].startswith('https://')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Reviewed CI revision: `{revision}`. No server connection or deployment performed.\n")
          PY

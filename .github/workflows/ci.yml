name: CI
on:
  pull_request:
  push:
    branches: [main, production]
  workflow_call:
permissions:
  contents: read
concurrency:
  # Promotion needs a trusted push run; PR merge-tree checks must not cancel it.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: python -m venv .venv/ops
      - run: .venv/ops/bin/python -m pip install --require-hashes -r scripts/ops/locks/ops.txt
      - run: make ops-check
      - run: make audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: dependency-audit, path: scripts/ops/evidence/dependency-audit, if-no-files-found: error}
      - run: make docs-check

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [backend, capture, recognition]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
      - run: python scripts/ops/tasks.py bootstrap --service '${{ matrix.service }}'
      - run: python scripts/ops/tasks.py python-check --service '${{ matrix.service }}'
        env: {ENVIRONMENT: test, SCHEDULER_ENABLED: 'false'}
      - name: Dependency audit (no ignored advisories)
        run: .venv/${{ matrix.service }}/bin/python -m pip_audit --progress-spinner off

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [backend, capture, recognition]
    env:
      COMPOSE_PROJECT_NAME: attendance-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service }}
      CI_DISPOSABLE: 'true'
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 ffmpeg libgl1
      - run: python scripts/ops/tasks.py bootstrap --service '${{ matrix.service }}'
      - name: Start disposable test dependencies (CI runner only)
        run: |
          docker compose -f docker-compose.test.yml up -d --wait
          db_port=$(docker compose -f docker-compose.test.yml port db 5432 | cut -d: -f2)
          s3_port=$(docker compose -f docker-compose.test.yml port minio 9000 | cut -d: -f2)
          echo "QUEUE_TEST_DSN=postgresql://test_owner:ci-disposable-not-a-production-secret@127.0.0.1:${db_port}/attendance_test" >> "$GITHUB_ENV"
          echo "CI_S3_ENDPOINT=127.0.0.1:${s3_port}" >> "$GITHUB_ENV"
      - name: Upgrade prior schema with data; private object storage
        if: matrix.service == 'backend'
        run: .venv/backend/bin/python scripts/check_integration.py
      - run: python scripts/ops/tasks.py test-integration --service '${{ matrix.service }}'
      - name: Native SQL role boundary test in a new disposable database
        if: matrix.service == 'backend'
        run: .venv/backend/bin/python scripts/check_roles.py
      - name: Demo seed boundaries in a new disposable database
        if: matrix.service == 'backend'
        run: .venv/backend/bin/python scripts/check_demo_seed.py
      - name: Remove only this disposable CI project
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

  full-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: attendance-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
      CI_DISPOSABLE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 ffmpeg libgl1 libseccomp2 restic
      - run: python scripts/ops/tasks.py bootstrap --service backend
      - run: python scripts/ops/tasks.py bootstrap --service recognition
      - name: Verify actual Linux inference restrictions
        run: .venv/recognition/bin/python recognition/tests/check_linux_sandbox.py
        env: {PYTHONPATH: recognition}
      - name: Provision pinned test weights (not a runtime download)
        run: |
          source=$(python -c 'import json; print(json.load(open("recognition/model-manifest.json"))["source"])')
          curl --fail --location --retry 5 --retry-delay 5 --retry-max-time 300 \
            --connect-timeout 20 --max-time 120 "$source" -o "$RUNNER_TEMP/pipeline-model.pt"
          digest=$(python -c 'import json; print(json.load(open("recognition/model-manifest.json"))["sha256"])')
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/pipeline-model.pt" | sha256sum --check --strict
      - name: Start only disposable CI dependencies
        run: |
          docker compose -f docker-compose.test.yml up -d --wait
          db_port=$(docker compose -f docker-compose.test.yml port db 5432 | cut -d: -f2)
          s3_port=$(docker compose -f docker-compose.test.yml port minio 9000 | cut -d: -f2)
          echo "QUEUE_TEST_DSN=postgresql://test_owner:ci-disposable-not-a-production-secret@127.0.0.1:${db_port}/attendance_test" >> "$GITHUB_ENV"
          echo "CI_S3_ENDPOINT=127.0.0.1:${s3_port}" >> "$GITHUB_ENV"
      - name: Real HTTP upload, image/video worker, report and joint restore
        run: .venv/backend/bin/python scripts/check_full_stack.py --output artifacts/full-stack --recognition-python .venv/recognition/bin/python --model "$RUNNER_TEMP/pipeline-model.pt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: full-stack-evidence, path: artifacts/full-stack, if-no-files-found: warn, retention-days: 14}
      - name: Remove only this disposable CI project
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '24.21.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python scripts/ops/tasks.py bootstrap --service backend
      - run: npm ci
        working-directory: frontend
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - run: npm run check:api
        working-directory: frontend
        env: {BACKEND_PYTHON: '${{ github.workspace }}/.venv/backend/bin/python'}
      - run: npm run lint && npm run typecheck && npm run test
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - name: Production artifact from this exact revision
        run: npm run build -- --outDir dist-production
        working-directory: frontend
        env: {VITE_STATIC_DATA: 'false'}
      - run: python3 scripts/check_frontend_bundle.py frontend/dist-production
      - name: Demo artifact from the same revision
        run: npm run build -- --outDir dist-demo --base=/edu-attendance-tracker/
        working-directory: frontend
        env: {VITE_STATIC_DATA: 'true'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: frontend-production, path: frontend/dist-production, if-no-files-found: error, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: frontend-demo, path: frontend/dist-demo, if-no-files-found: error, retention-days: 14}
      - run: npm run test:e2e
        working-directory: frontend
        env: {CI: 'true'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
          retention-days: 14

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env: {GITHUB_TOKEN: '${{ github.token }}'}
      - name: Install checksum-pinned security scanner
        run: |
          python3 scripts/ops/install_trivy.py "$RUNNER_TEMP/trivy-bin"
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-setup-trivy: 'true'
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: source-sbom, path: sbom.cdx.json, if-no-files-found: error}

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: backend, context: ., dockerfile: backend/Dockerfile}
          - {service: frontend, context: frontend, dockerfile: frontend/Dockerfile}
          - {service: capture, context: ., dockerfile: capture/Dockerfile}
          - {service: recognition, context: ., dockerfile: recognition/Dockerfile}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Build commit-tagged candidate; no registry login or push
        id: image
        run: docker build -f '${{ matrix.dockerfile }}' -t 'attendance-${{ matrix.service }}:${{ github.sha }}' '${{ matrix.context }}'
      - name: Verify actual Nginx runtime assets on disposable runner
        if: matrix.service == 'frontend'
        run: |
          container=$(docker run -d --rm --add-host backend:127.0.0.1 -p 127.0.0.1::8080 attendance-frontend:${{ github.sha }})
          trap 'docker rm -f "$container"' EXIT
          port=$(docker port "$container" 8080 | cut -d: -f2)
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 "http://127.0.0.1:${port}/" > /dev/null
          python3 scripts/check_static_http.py "http://127.0.0.1:${port}"
      - name: Install checksum-pinned security scanner
        id: scanner
        run: |
          python3 scripts/ops/install_trivy.py "$RUNNER_TEMP/trivy-bin"
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: attendance-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: vulnerabilities.json
          skip-setup-trivy: 'true'
      - name: Inventory licenses
        id: licenses
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.scanner.outcome == 'success' }}
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: attendance-${{ matrix.service }}:${{ github.sha }}
          scanners: license
          format: json
          output: licenses.json
          skip-setup-trivy: 'true'
      - run: python3 scripts/check_licenses.py licenses.json
        if: ${{ !cancelled() && steps.licenses.outcome == 'success' }}
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.scanner.outcome == 'success' }}
        with:
          image-ref: attendance-${{ matrix.service }}:${{ github.sha }}
          format: cyclonedx
          output: container-sbom.cdx.json
          skip-setup-trivy: 'true'
      - name: Preserve inspection reports even when release is blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-inspection-${{ matrix.service }}-${{ github.sha }}
          path: |
            vulnerabilities.json
            licenses.json
            container-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save the tested bytes, never rebuild during deployment
        run: |
          docker save 'attendance-${{ matrix.service }}:${{ github.sha }}' | gzip > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
          docker image inspect 'attendance-${{ matrix.service }}:${{ github.sha }}' --format '{{json .Id}}' > image-id.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-${{ matrix.service }}-${{ github.sha }}
          path: |
            image.tar.gz
            image.tar.gz.sha256
            image-id.json
            licenses.json
            container-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  diagrams:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.21.0'}
      - run: npm ci
        working-directory: docs/diagrams
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: docs/diagrams
      - run: make diagrams-check
      - run: npm test
        working-directory: docs/diagrams
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: diagrams, path: docs/diagrams/rendered, if-no-files-found: error}
